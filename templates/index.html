<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AstroLokal — AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <!-- Stand-in for the AstroLokal app screen the real chat webview opens
         on top of — not part of the widget itself. -->
    <div class="host-screen">
      <div class="host-topbar">
        <span class="host-brand">🕉️ AstroLokal</span>
        <span class="host-coins">🪙 1500</span>
      </div>
      <div class="host-hint">Tap the sparkle button to open the AI assistant</div>
    </div>

    <button id="chatFab" class="chat-fab" type="button" aria-label="Open chat">✨</button>

    <div id="chatOverlay" class="chat-overlay" hidden>
      <div class="chat-modal" role="dialog" aria-label="Chat with AI Assistant">
        <div class="chat-modal-header">
          <div class="chat-modal-title"><span class="sparkle">✨</span> Chat with AI Assistant</div>
          <button id="chatClose" class="chat-close" type="button" aria-label="Close chat">×</button>
        </div>

        <div class="chat-body" id="chatBody">
          {% for msg in messages %}
            <div class="message {{ msg.sender }}">{{ msg.text }}</div>
          {% endfor %}
        </div>

        <div class="quick-replies" id="quickReplies">
          {% for item in quick_replies %}
            <button class="quick-reply" type="button" data-text="{{ item }}">{{ item }}</button>
          {% endfor %}
        </div>

        <div class="input-bar">
          <input id="chatInput" class="text-input" placeholder="Type your message..." />
          <button class="send-btn" id="sendBtn" type="button" aria-label="Send">➤</button>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
