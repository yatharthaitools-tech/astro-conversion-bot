<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AstroLokal — AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body data-user-id="{{ user_id }}" data-oauth-token="{{ oauth_token }}" data-user-name="{{ user_name }}" data-ltv="{{ ltv }}">
    <div class="chat-modal" role="dialog" aria-label="Chat with AstroLokal">
      <div class="chat-modal-header">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="40" height="40">
            <defs>
              <linearGradient id="taraGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ff9a56"/>
                <stop offset="100%" stop-color="#e8532f"/>
              </linearGradient>
            </defs>
            <circle cx="20" cy="20" r="20" fill="url(#taraGrad)"/>
            <path d="M8 34.5c0-6.8 5.4-11.8 12-11.8s12 5 12 11.8" fill="#fff" opacity="0.95"/>
            <path d="M20 5.2c-5.7 0-9.9 4.4-9.9 10.1 0 3.6 1.6 7.2 3 9.3.1-4.3.9-8 2.6-10.2 1.5 2 4 3.2 6.3 3.2s4.8-1.2 6.3-3.2c1.7 2.2 2.5 5.9 2.6 10.2 1.4-2.1 3-5.7 3-9.3 0-5.7-4.2-10.1-9.9-10.1-1.4 0-2.7.2-4 .7-.7.2-1.4.4-2 .3z" fill="#43291d"/>
            <path d="M11.8 17c-.6 3.6-.4 7.4.6 9.8" fill="none" stroke="#43291d" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M28.2 17c.6 3.6.4 7.4-.6 9.8" fill="none" stroke="#43291d" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="20" cy="18.3" r="6.4" fill="#f7cca4"/>
            <circle cx="20" cy="13.6" r="0.95" fill="#e8532f"/>
            <path d="M17.1 20.6c1.3 1.1 4.5 1.1 5.8 0" stroke="#a5623a" stroke-width="1" stroke-linecap="round" fill="none"/>
          </svg>
          <span class="brand-status" aria-hidden="true"></span>
        </div>
        <div class="chat-modal-title">
          <div class="title-main">AstroLokal</div>
          <div class="title-sub">Your astrology companion</div>
        </div>
        <button class="close-btn" id="closeBtn" type="button" aria-label="Close chat">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M3 3l10 10M13 3L3 13"/>
          </svg>
        </button>
      </div>

      <div class="chat-body" id="chatBody">
        {% for msg in messages %}
          <div class="message {{ msg.sender }}">{{ msg.text }}</div>
        {% endfor %}
      </div>

      <div class="quick-replies" id="quickReplies">
        {% for item in quick_replies %}
          <button class="quick-reply" type="button" data-text="{{ item.text }}">
            <span class="quick-reply-icon">{{ item.icon | safe }}</span>{{ item.text }}
          </button>
        {% endfor %}
      </div>

      <div class="input-bar">
        <button class="photo-btn" id="photoBtn" type="button" aria-label="Upload photo">
          <svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 5.6A1.4 1.4 0 0 1 3.4 4.2h1.3l.6-1a1 1 0 0 1 .9-.5h3.6a1 1 0 0 1 .9.5l.6 1h1.3A1.4 1.4 0 0 1 14 5.6v5.8A1.4 1.4 0 0 1 12.6 12.8H3.4A1.4 1.4 0 0 1 2 11.4V5.6z"/>
            <circle cx="8" cy="8.4" r="2.3"/>
          </svg>
        </button>
        <input id="photoInput" type="file" accept="image/*" hidden />
        <input id="chatInput" class="text-input" placeholder="What's been on your mind?" />
        <button class="send-btn" id="sendBtn" type="button" aria-label="Send">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
            <path d="M2 8L13.6 2.4 8.9 13.6 6.9 9.1 2 8z"/>
          </svg>
        </button>
      </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
